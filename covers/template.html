<!DOCTYPE html>
<!--
  Cover template for case-study thumbnails. Every cover is a full-bleed crop so the card grid reads as one body of work.
  Usage: template.html?shot=zero&zoom=1.4&x=50&y=0  (loads shots/zero.jpg, a 1440×900 dark-mode capture)
    zoom  scale past the cover fit, so sparse pages fill the frame (default 1)
    x, y  focal point in percent, kept in place while zooming (default 50, 0)
  Crops live in render.sh, which writes the 1600×840 JPEGs to images/.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 800px;
      height: 420px;
      overflow: hidden;
      background: #000;
    }

    img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <img id="shot" alt="">
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var img = document.getElementById('shot');
      var focus = (q.get('x') || '50') + '% ' + (q.get('y') || '0') + '%';
      img.style.objectPosition = focus;
      img.style.transformOrigin = focus;
      img.style.transform = 'scale(' + (q.get('zoom') || '1') + ')';
      img.src = 'shots/' + (q.get('shot') || '') + '.jpg';
    })();
  </script>
</body>
</html>
